<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conta | Casa de Patas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topo" id="topo"></header>
<main>
  <div class="painel" style="text-align:center">
    <div class="arco sem-foto" style="width:90px;margin:0 auto 1rem"></div>
    <h1 style="font-size:2rem" id="titulo">Sua conta</h1>
    <p class="suave" id="texto" style="margin-inline:auto"></p>
    <div class="acoes" id="acoes" style="justify-content:center"></div>
  </div>
</main>
<footer id="rodape"></footer>
<script src="/js/app.js"></script>
<script>
(async () => {
  await iniciar();
  if (SESSAO) {
    $("#titulo").textContent = `Olá, ${SESSAO.nome.split(" ")[0]}`;
    $("#texto").textContent = "Veja suas adoções ou procure um novo amigo.";
    $("#acoes").innerHTML = `<a class="btn btn-rosa" href="/minha-conta">Minha conta</a><a class="btn btn-borda" href="/animais">Ver animais</a>`;
  } else {
    $("#texto").textContent = "Entre ou crie uma conta para demonstrar interesse em um animal.";
    $("#acoes").innerHTML = `<a class="btn btn-rosa" href="/login">Entrar</a><a class="btn btn-borda" href="/cadastro">Criar conta</a>`;
  }
})();
</script>
</body>
</html>
