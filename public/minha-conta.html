<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta - AdotaPET</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">AdotaPET</a>
        <nav aria-label="Navegação principal">
            <a href="/" aria-current="page">Início</a>
            <a href="/conta" data-nav-register>Cadastro</a>
            <a href="/minha-conta" data-nav-account>Minha conta</a>
            <a href="/animais">Animais</a>
            <a href="/abrigos">Abrigos</a>
            <a href="/contact">Contato</a>
        </nav>
</header>
    <main class="account-page">
        <div class="account-content">
            <div class="account-heading">
                <div>
                    <p class="eyebrow">Seu espaço AdotaPET</p>
                    <h1>Olá, <span id="nome-usuario">...</span></h1>
                    <p>Acompanhe seus processos de adoção.</p>
                </div>
                <div class="account-actions">
                    <button class="button-secondary" id="botao-editar-perfil" type="button" aria-expanded="false" aria-controls="formulario-perfil">Editar perfil</button>
                    <button class="button-secondary" id="botao-sair" type="button">Sair da conta</button>
                </div>
            </div>

            <form class="profile-form" id="formulario-perfil" hidden>
                <div class="profile-field">
                    <label for="perfil-nome">Nome</label>
                    <input id="perfil-nome" name="nome" type="text" required>
                </div>

                <div class="profile-field">
                    <label for="perfil-email">E-mail</label>
                    <input id="perfil-email" name="email" type="email" required>
                </div>

                <div class="profile-form-actions">
                    <button type="submit">Salvar alterações</button>
                    <p id="mensagem-perfil" aria-live="polite"></p>
                </div>
            </form>

            <section class="account-panel" aria-labelledby="adocoes-titulo">
                <h2 id="adocoes-titulo">Minhas adoções</h2>
                <p id="mensagem-conta" class="registration-message" aria-live="polite">Carregando...</p>
                <ul class="animal-list" id="lista-adocoes"></ul>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <p>AdotaPET — Adoção responsável transforma vidas.</p>
    </footer>
    <script src="/minha-conta.js"></script>
    <script src="/navbar.js"></script>
</body>
</html>
