<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar conta | Casa de Patas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topo" id="topo"></header>
<main>
  <div class="painel">
    <h1 style="font-size:2rem">Criar conta</h1>
    <p class="suave">Com uma conta você pode demonstrar interesse em um animal e acompanhar a adoção.</p>
    <form id="form" novalidate>
      <p class="erro" role="alert" hidden></p>
      <div class="campo"><label for="nome">Nome</label><input id="nome" name="nome" autocomplete="name" required></div>
      <div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="linha2">
        <div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="new-password" required></div>
        <div class="campo"><label for="confirma">Repita a senha</label><input id="confirma" name="confirma" type="password" autocomplete="new-password" required></div>
      </div>
      <button class="btn btn-rosa" style="width:100%" type="submit">Criar conta</button>
    </form>
    <p class="suave" style="margin:1rem 0 0">Já tem conta? <a href="/login">Entrar</a></p>
  </div>
</main>
<footer id="rodape"></footer>
<script src="/js/app.js"></script>
<script>
(async () => {
  await iniciar();
  if (SESSAO) return location.replace("/minha-conta");
  const form = $("#form");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    if (!d.nome.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) return mostrarErro(form, "Informe seu nome e um e-mail válido.");
    if (!d.senha) return mostrarErro(form, "Escolha uma senha.");
    if (d.senha !== d.confirma) return mostrarErro(form, "As senhas não são iguais.");
    try { await api("/cadastro", { method: "POST", body: { nome: d.nome.trim(), email: d.email.trim(), senha: d.senha } }); location.href = "/login?cadastrado=1"; }
    catch (er) { mostrarErro(form, er.message); }
  });
})();
</script>
</body>
</html>
